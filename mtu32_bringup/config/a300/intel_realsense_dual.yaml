a300_00036/sensors/camera_1:
  intel_realsense:
    ros__parameters:
      camera_name: camera_1
      camera_namespace: a300_00036
      serial_no: '130322271563'
      usb_port_id: ''
      device_type: 'd405'
      config_file: ''
      json_file_path: ''
      initial_reset: false
      accelerate_gpu_with_glsl: false
      rosbag_filename: ''
      log_level: info
      output: screen
      enable_color: true
      depth_module.color_profile: 848,480,30   # [IMG] resolution and frame rate
      depth_module.color_format: RGB8          # [IMG] pixel format
      enable_depth: true
      enable_infra: false
      enable_infra1: false                     # [-] mono Y8; better low-light SNR if ever needed
      enable_infra2: false
      depth_module.depth_profile: 848,480,15   # [DEPTH] resolution and frame rate
      depth_module.depth_format: Z16           # [DEPTH]
      depth_module.infra_profile: 0,0,0
      depth_module.infra_format: RGB8
      depth_module.infra1_format: Y8
      depth_module.infra2_format: Y8
      depth_module.exposure: 8500              # [BOTH] microseconds, range 1-165000
      depth_module.gain: 16                    # [BOTH] range 16-248
      depth_module.enable_auto_exposure: true  # [BOTH]
      depth_module.auto_exposure_limit_toggle: true   # [BOTH] arms the cap below
      depth_module.auto_exposure_limit: 10000         # [BOTH] us; lower if blurred, raise if dark
      depth_module.auto_gain_limit_toggle: true       # [BOTH] arms the cap below
      depth_module.auto_gain_limit: 192               # [BOTH] noise vs brightness
      depth_module.enable_auto_white_balance: false   # [IMG]
      depth_module.white_balance: 4600.0              # [IMG] K, range 2800-6500
      # Only matters under artificial lighting; harmless outdoors.
      depth_module.power_line_frequency: 2            # [IMG] 0 off, 1 50Hz, 2 60Hz, 3 auto
      depth_module.saturation: 64                     # [IMG] 0-100; lower mutes the magenta cast
      depth_module.hdr_enabled: false          # [DEPTH]
      depth_module.exposure.1: 7500            # [DEPTH] only used when hdr_enabled
      depth_module.gain.1: 16                  # [DEPTH] only used when hdr_enabled
      depth_module.exposure.2: 1               # [DEPTH] only used when hdr_enabled
      depth_module.gain.2: 16                  # [DEPTH] only used when hdr_enabled
      enable_sync: false                       # [BOTH] colour/depth timestamp pairing
      enable_rgbd: false
      enable_gyro: false
      enable_accel: false
      gyro_fps: 0
      accel_fps: 0
      unite_imu_method: 0
      clip_distance: -2.                       # [DEPTH] metres; negative disables
      angular_velocity_cov: 0.01
      linear_accel_cov: 0.01
      diagnostics_period: 0.0
      publish_tf: true
      tf_publish_rate: 0.0
      pointcloud.enable: true
      pointcloud.stream_filter: 2              # [DEPTH] texture source, 2 = colour
      pointcloud.stream_index_filter: 0
      pointcloud.ordered_pc: false
      pointcloud.allow_no_texture_points: false  # [DEPTH] false drops untextured points
      align_depth.enable: false                # [DEPTH] needed to sample depth at colour pixels
      colorizer.enable: false
      decimation_filter.enable: false          # [DEPTH] downsamples, fills holes, loses detail
      spatial_filter.enable: false             # [DEPTH] edge-preserving smoothing
      temporal_filter.enable: false            # [DEPTH] smears moving objects
      disparity_filter.enable: false           # [DEPTH] filter in disparity space
      hole_filling_filter.enable: false        # [DEPTH] invents data in gaps
      hdr_merge.enable: false                  # [DEPTH] requires hdr_enabled
      wait_for_device_timeout: -1.             # negative waits forever, silently
      reconnect_timeout: 6.