      device_type: 'd405'
      config_file: ''
      json_file_path: ''
      initial_reset: False
      accelerate_gpu_with_glsl: False
      rosbag_filename: ''
      log_level: 'info'
      output: 'screen'
      enable_color: True
      rgb_camera.color_profile: '1280x720x15' #'640x360x15' # '1280x720x15'  #'1280,720,30'
      rgb_camera.color_format: 'RGB8'
      rgb_camera.enable_auto_exposure: True
      enable_depth: True
      enable_infra: False
      enable_infra1: False
      enable_infra2: False
      depth_module.profile: '1280x720x15'
      depth_module.color_profile: '1280x720x15' #'1280x720x15'
      depth_module.depth_profile: '1280x720x15' #'848x480x30'
      depth_module.depth_format: 'Z16'
      depth_module.infra_profile: '0,0,0'
      depth_module.infra_format: 'RGB8'
      depth_module.infra1_format: 'Y8'
      depth_module.infra2_format: 'Y8'
      depth_module.exposure: 8500
      depth_module.gain: 16
      depth_module.hdr_enabled: False
      depth_module.enable_auto_exposure: True
      depth_module.exposure.1: 7500
      depth_module.gain.1: 16
      depth_module.exposure.2: 1
      depth_module.gain.2: 16
      enable_sync: True
      enable_rgbd: False
      enable_gyro: False
      enable_accel: False
      gyro_fps: 0
      accel_fps: 0
      unite_imu_method: 0
      clip_distance: 0.7
      angular_velocity_cov: 0.01
      linear_accel_cov: 0.01
      diagnostics_period: 0.0
      publish_tf: True
      tf_publish_rate: 0.0
      pointcloud.enable: True
      pointcloud.stream_filter: 2
      pointcloud.stream_index_filter: 0
      pointcloud.ordered_pc: False
      pointcloud.allow_no_texture_points: True
      align_depth.enable: True
      colorizer.enable: False
      decimation_filter.enable: False
      disparity_filter.enable: False
      disparity_to_depth.enable: False
      hole_filling_filter.enable: False
      hdr_merge.enable: False
      wait_for_device_timeout: -1.0
      reconnect_timeout: 6.0
      # Enable Spatial, Temporal, and Hole Filling filters (they preserve thin edges automatically)
      spatial_filter.enable: False
      spatial_filter.spatial_alpha: 0.5
      spatial_filter.spatial_delta: 20

      temporal_filter.enable: False
      temporal_filter.temporal_alpha: 0.4
      temporal_filter.temporal_delta: 20

      hole_filling_filter.enable: False
      hole_filling_filter.holes_fill: 1
      depth_module.visual_preset: 3
