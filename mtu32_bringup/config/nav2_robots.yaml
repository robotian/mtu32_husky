# Per-robot settings for bringup_nav2_map.launch.py (one Nav2-on-a-map launch file for every robot).
#
# The robot is identified from /etc/clearpath/robot.yaml (namespace + platform model). Settings are looked up in
# order, later wins:  defaults  ->  platforms.<platform model>  ->  robots.<namespace>
# A launch argument of the same name (params_file, scan_topic, map) overrides all of them.
#
#   params_file      Nav2 params: a file name in config/<platform>/ or an absolute path. A list means "the first one
#                    that exists", so a platform without its own nav2_map.yaml falls back to its nav2.yaml.
#   scan_topic       One 2D LaserScan for the costmaps' obstacle layers and the collision monitor (replaces every
#                    `topic:` key of the params file), relative to the robot namespace.
#                    auto   = sensors/lidar2d_0/scan_filtered if robot.yaml has a lidar2d, else sensors/camera_0/scan
#                             (depthimage_to_laserscan, started by bringup_main.launch.py). Obstacle detection looks
#                             forward: a robot whose lidar doesn't face the front sets the front camera's scan here.
#                    params = keep the params file's own observation sources (e.g. several scans per layer); only
#                             their namespace is set to this robot's (/a200_0284/sensors/... -> /<namespace>/sensors/...).
#   map              Map yaml: a file name in mtu32_bringup's map/ or an absolute path.
#   param_overrides  Nav2 parameters merged over params_file, in the same layout as the file (dicts are merged
#                    key by key, anything else is replaced), for the few values one robot needs differently.
#                    Example:
#                      param_overrides:
#                        controller_server:
#                          ros__parameters:
#                            FollowPath:
#                              vx_max: 0.3

defaults:
  params_file: [nav2_map.yaml, nav2.yaml]
  scan_topic: auto
  map: zone_end_2.yaml
  # The other robots in the global costmap, so the planner goes round them (on the map alone it planned through a
  # robot harvesting in the way, and both stopped nose to nose for good, 2026-10-15). scripts/fleet_obstacles.py
  # fills their published footprints (marking) and sends an all-clear scan around this robot (clearing; the
  # layer clears before it marks, so a robot that moved leaves no trace). Only the robots, never the crop.
  param_overrides:
    global_costmap:
      global_costmap:
        ros__parameters:
          fleet_layer:
            plugin: nav2_costmap_2d::ObstacleLayer
            enabled: true
            footprint_clearing_enabled: false
            observation_sources: fleet_clear fleet_mark
            fleet_clear: {topic: fleet_obstacles/scan, data_type: LaserScan, clearing: true, marking: false,
                          raytrace_max_range: 25.0, min_obstacle_height: -1.0, max_obstacle_height: 2.0}
            fleet_mark: {topic: fleet_obstacles/cloud, data_type: PointCloud2, clearing: false, marking: true,
                         obstacle_max_range: 100.0, min_obstacle_height: 0.0, max_obstacle_height: 2.0}

platforms:
  # Global costmaps plan on the farm map and the other robots (fleet_layer, above) only: with a scan in them the
  # planner found no path into the lanes (the lavender beside the robot marked lethal; shipped setups finished 0
  # of 7 legs on the a300, 2 of 14 on the a200).
  # The local costmap and the collision monitor see the forward scan (front lidar, else front camera), so the
  # controller sees obstacles that aren't on the map. Tuning reports: multirobot_sim docs/nav2_tuning_<platform>.md
  # (tuned map-only; the local obstacle layer is back since 2026-10-14, not re-tuned).
  a300:
    # The Hokuyo on the wireless charger mount faces the right side: the front RealSense's depth scan, by point
    # density (scripts/dense_scan.py): the plain scan is the tips of the lavender stems reaching into the lane, so
    # the 0.70 m-wide robot saw 0.67-0.77 m lanes as blocked and MPPI stopped short of every off-centre goal.
    scan_topic: sensors/camera_0/scan_dense
    param_overrides:
      global_costmap:
        global_costmap:
          ros__parameters:
            plugins: [static_layer, fleet_layer, inflation_layer]
  j100:
    # auto: j100_0936's front SICK LMS1xx; j100_0921/0922 (no lidar) the front ZED's depth scan.
    # Global costmap: also what the scan sees for the last few seconds (scan_layer), so the planner goes round it
    # without keeping it: each update clears around the robot (fleet_obstacles.py's all-clear scan) and marks the
    # scans of the last observation_persistence s, so an obstacle fades 5 s after it leaves the camera's view (a
    # plain obstacle layer kept everything the forward-only camera stopped seeing). After the map's inflation_layer,
    # with scan_inflation's 0.3 m: the map keeps 0.8 m (centres the lane paths), scanned lavender gets 0.3 (0.8
    # closed the 0.74 m lanes).
    param_overrides:
      global_costmap:
        global_costmap:
          ros__parameters:
            plugins: [static_layer, fleet_layer, inflation_layer, scan_layer, scan_inflation]
            scan_layer:
              plugin: nav2_costmap_2d::ObstacleLayer
              enabled: true
              footprint_clearing_enabled: false
              observation_sources: fleet_clear camera
              fleet_clear: {topic: fleet_obstacles/scan, data_type: LaserScan, clearing: true, marking: false,
                            raytrace_max_range: 25.0, min_obstacle_height: -1.0, max_obstacle_height: 2.0}
              camera: {topic: scan, data_type: LaserScan, clearing: false, marking: true, observation_persistence: 5.0,
                       obstacle_max_range: 2.5, max_obstacle_height: 2.0}  # topic: the robot's scan_topic
            scan_inflation:
              plugin: nav2_costmap_2d::InflationLayer
              cost_scaling_factor: 4.0
              inflation_radius: 0.3
  a200:
    # auto: a200_0284/0333's front lidar (self-filtered by bringup_main.launch.py), the generic a200 its RealSense.
    param_overrides:
      global_costmap:
        global_costmap:
          ros__parameters:
            plugins: [static_layer, fleet_layer, inflation_layer]
      local_costmap:
        local_costmap:
          ros__parameters:
            obstacle_layer:
              # a200/nav2.yaml's second source (low_scan, the camera) would read the same scan again
              observation_sources: high_scan

robots: {}
  # a300_00036:
  #   map: zone_end_2.yaml
