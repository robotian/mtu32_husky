# Per-robot settings for bringup_nav2_map.launch.py (one Nav2-on-a-map launch file for every robot).
#
# The robot is identified from /etc/clearpath/robot.yaml (namespace + platform model). Settings are looked up in
# order, later wins:  defaults  ->  platforms.<platform model>  ->  robots.<namespace>
# A launch argument of the same name (params_file, scan_topic, map) overrides all of them.
#
#   params_file      Nav2 params: a file name in config/<platform>/ or an absolute path. A list means "the first one
#                    that exists", so a platform without its own nav2_map.yaml falls back to its nav2.yaml.
#   scan_topic       One 2D LaserScan for the costmaps' obstacle layers and the collision monitor (replaces every
#                    `topic:` key of the params file), relative to the robot namespace.
#                    auto   = sensors/lidar2d_0/scan_filtered if robot.yaml has a lidar2d, else sensors/camera_0/scan
#                             (depthimage_to_laserscan, started by bringup_main.launch.py).
#                    params = keep the params file's own observation sources (e.g. several scans per layer); only
#                             their namespace is set to this robot's (/a200_0284/sensors/... -> /<namespace>/sensors/...).
#   map              Map yaml: a file name in mtu32_bringup's map/ or an absolute path.
#   param_overrides  Nav2 parameters merged over params_file, in the same layout as the file (dicts are merged
#                    key by key, anything else is replaced), for the few values one robot needs differently.
#                    Example:
#                      param_overrides:
#                        controller_server:
#                          ros__parameters:
#                            FollowPath:
#                              vx_max: 0.3

defaults:
  params_file: [nav2_map.yaml, nav2.yaml]
  scan_topic: auto
  map: zone_end_2.yaml

platforms:
  a300:
    # As bringup_nav2_map_a300.launch.py: the RealSense's depth scan, not the Hokuyo on the wireless charger mount.
    scan_topic: sensors/camera_0/scan
    # Plan and control on the farm map, as the j100 (see there): with the scan in the costmaps the shipped setup
    # finished 0 of 7 legs (the planner found no path into the first lane). Tuning report: multirobot_sim
    # docs/nav2_tuning_a300.md.
    param_overrides:
      global_costmap:
        global_costmap:
          ros__parameters:
            plugins: [static_layer, inflation_layer]
      local_costmap:
        local_costmap:
          ros__parameters:
            plugins: [static_layer, inflation_layer]
  j100:
    # No 2D lidar: the ZED's depth image through depthimage_to_laserscan.
    scan_topic: sensors/camera_0/scan
    # Plan and control on the farm map; the camera scan only feeds the collision monitor (stops before anything in
    # the path). In the lanes (0.74 m between plants, pickup lines 0.13 m off centre) the scan marks the lavender
    # beside the robot as lethal: the planner then failed between waypoints and a footprint-checking controller
    # (Graceful, RPP) refused to move. Cost: no planning around an obstacle that isn't on the map (the robot stops
    # and waits). Tuning report: multirobot_sim docs/nav2_tuning_j100.md.
    param_overrides:
      global_costmap:
        global_costmap:
          ros__parameters:
            plugins: [static_layer, inflation_layer]
      local_costmap:
        local_costmap:
          ros__parameters:
            plugins: [static_layer, inflation_layer]
  a200:
    # a200/nav2.yaml fuses the SICK LMS1xx (lidar2d_0/scan_filtered, self-filtered by bringup_main.launch.py) and the
    # RealSense depth scan (camera_0/scan); the collision monitor uses the lidar.
    scan_topic: params
    # Plan and control on the farm map, as the j100 and a300 (see the j100): with both scans in the costmaps the
    # shipped setup finished 2 of 14 legs. The lidar still feeds the collision monitor. Tuning report: multirobot_sim
    # docs/nav2_tuning_a200.md.
    param_overrides:
      global_costmap:
        global_costmap:
          ros__parameters:
            plugins: [static_layer, inflation_layer]
      local_costmap:
        local_costmap:
          ros__parameters:
            plugins: [static_layer, inflation_layer]

robots: {}
  # a300_00036:
  #   map: zone_end_2.yaml
